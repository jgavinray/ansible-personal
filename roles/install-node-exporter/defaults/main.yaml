---
# Node Exporter version to install
node_exporter_version: "1.2.2"
node_exporter_release_url: "https://github.com/prometheus/node_exporter/releases/download"

# Installation paths
node_exporter_bin_path: "/usr/bin"
node_exporter_service_path: "/etc/systemd/system/node_exporter.service"

# Architecture mapping: Ansible architecture -> node_exporter release architecture
node_exporter_arch_mapping:
  x86_64: amd64
  aarch64: arm64
  armv7l: armv7
  armv6l: armv6

# SHA256 checksums for node_exporter-1.2.2 tarballs
# https://github.com/prometheus/node_exporter/releases/download/v1.2.2/sha256sums.txt
node_exporter_checksums:
